spring.application.name=employee-management-system

# H2 in-memory database - zero setup needed to run locally
spring.datasource.url=jdbc:h2:mem:emsdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=${PORT:8080}

# --- To switch to MySQL for a production-style demo, comment out the H2 block above
# and uncomment this (also uncomment the mysql-connector-j dependency in pom.xml):
# spring.datasource.url=jdbc:mysql://localhost:3306/emsdb?createDatabaseIfNotExist=true
# spring.datasource.username=root
# spring.datasource.password=yourpassword
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
